<header class="site-header">
  <div class="container header-inner">
    <a class="site-brand" href="{{ '/' | relative_url }}">
      <span class="brand-mark">T</span>
      <span class="brand-text">{{ site.title }}</span>
    </a>

    <button class="nav-toggle" aria-label="切换菜单" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>

    <nav class="site-nav" aria-label="主导航">
      {% for item in site.nav %}
        {% assign is_active = false %}
        {% if item.url == page.url %}{% assign is_active = true %}{% endif %}
        <a href="{{ item.url | relative_url }}"
           class="nav-link{% if is_active %} active{% endif %}">{{ item.title }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
