<footer class="site-footer">
  <div class="container footer-inner">
    <div class="footer-about">
      <strong>{{ site.title }}</strong>
      <p>{{ site.description | strip_newlines }}</p>
    </div>

    <div class="footer-links">
      {% if site.social.github %}<a href="{{ site.social.github }}" target="_blank" rel="noopener">GitHub</a>{% endif %}
      {% if site.social.email and site.social.email != "" %}<a href="mailto:{{ site.social.email }}">Email</a>{% endif %}
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
    </div>
  </div>

  <div class="container footer-copy">
    <span>© {{ site.time | date: '%Y' }} {{ site.title }}</span>
    <span>Powered by <a href="https://jekyllrb.com" target="_blank" rel="noopener">Jekyll</a></span>
  </div>
</footer>
