<article class="post-card">
  <div class="post-card-body">
    <h3 class="post-card-title">
      <a href="{{ include.post.url | relative_url }}">{{ include.post.title }}</a>
    </h3>

    <p class="post-card-excerpt">
      {{ include.post.description | default: include.post.excerpt | strip_html | truncate: 120 }}
    </p>

    <div class="post-card-meta">
      <time datetime="{{ include.post.date | date_to_xmlschema }}">{{ include.post.date | date: '%Y-%m-%d' }}</time>
      {% if include.post.categories.size > 0 %}
        <span class="dot">·</span>
        {% for c in include.post.categories %}<a class="tag" href="{{ '/categories/' | append: c | append: '/' | relative_url }}">{{ c }}</a>{% endfor %}
      {% endif %}
    </div>
  </div>
</article>
