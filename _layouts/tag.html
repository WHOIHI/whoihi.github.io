---
layout: default
---
<div class="page-header">
  <h1 class="page-title">标签:{{ page.tag }}</h1>
  <p class="page-subtitle">共 {{ page.posts | size }} 篇文章</p>
</div>

<div class="post-list">
  {% for post in page.posts %}
    {% include post-card.html post=post %}
  {% endfor %}
</div>

<p class="back-link"><a href="{{ '/tags/' | relative_url }}">← 全部标签</a></p>
