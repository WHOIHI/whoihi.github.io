---
layout: default
---
<div class="page-header">
  <h1 class="page-title">分类:{{ page.category }}</h1>
  <p class="page-subtitle">共 {{ page.posts | size }} 篇文章</p>
</div>

<ul class="classify-list classify-list-single">
  {% for post in page.posts %}
  <li class="classify-item">
    <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: '%Y-%m-%d' }}</time>
    <a class="classify-link" href="{{ post.url | relative_url }}">{{ post.title }}</a>
    <span class="classify-badges">
      {% for t in post.tags %}
        <a class="tag" href="{{ '/tags/' | append: t | append: '/' | relative_url }}">{{ t }}</a>
      {% endfor %}
    </span>
  </li>
  {% endfor %}
</ul>

<p class="back-link"><a href="{{ '/categories/' | relative_url }}">← 全部分类</a></p>
